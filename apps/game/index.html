<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#10121a" />
    <meta name="description" content="Jayu: Jetpack Brawl — fast 2D jetpack battles online, on local Wi-Fi or against bots." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Jayu: Jetpack Brawl</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10121a; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #ffd34d; font: 800 28px system-ui, sans-serif; letter-spacing: 0.04em; }
      #boot span { animation: pulse 1s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 0.4 } to { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="boot"><span>JAYU</span></div>
    <div id="root"></div>
    <noscript>Jayu needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
