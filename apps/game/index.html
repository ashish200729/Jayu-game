<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d16" />
    <meta name="description" content="Jayu: Jetpack Brawl — fast 2D jetpack battles online, on local Wi-Fi or against bots." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Jayu: Jetpack Brawl</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d16; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 110%, #5a2350 0%, #241640 38%, #0b0d16 75%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #boot .b { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
      #boot .w { font-size: 64px; font-weight: 900; letter-spacing: .1em; background: linear-gradient(180deg, #fff6cf 0%, #ffd34d 48%, #ffa928 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 8px 24px rgba(255,170,40,.35)); }
      #boot .t { margin-top: -14px; font-size: 12px; font-weight: 800; letter-spacing: .38em; color: rgba(255,255,255,.75); text-transform: uppercase; }
      #boot .p { position: relative; width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
      #boot .p::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, transparent, #ffd34d, transparent); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { #boot .b, #boot .p::after { animation: none } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Jayu"><div class="b"><div class="w">JAYU</div><div class="t">Jetpack Brawl</div><div class="p"></div></div></div>
    <div id="root"></div>
    <noscript>Jayu needs JavaScript to run.</noscript>
    <script>
      // Startup safety net: if the app fails before its first screen, show why (instead of a blank screen)
      // and offer a reload. Removed with #boot once React renders.
      (function () {
        var shown = false;
        function fail(msg) {
          var boot = document.getElementById('boot');
          if (!boot || shown) return;
          shown = true;
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;padding:12px 16px;border-radius:14px;background:rgba(10,12,20,.92);border:1px solid rgba(255,255,255,.15);color:#f4f6fb;font:600 13px system-ui,sans-serif;text-align:center;line-height:1.4';
          var t = document.createElement('div');
          t.textContent = 'Jayu could not start: ' + String(msg).slice(0, 220);
          var btn = document.createElement('button');
          btn.textContent = 'Reload';
          btn.style.cssText = 'margin-top:10px;padding:10px 22px;border:0;border-radius:10px;background:#ffd34d;color:#1b1d26;font:800 14px system-ui,sans-serif';
          btn.onclick = function () { location.reload(); };
          box.appendChild(t);
          box.appendChild(btn);
          boot.appendChild(box);
        }
        window.addEventListener('error', function (e) { fail((e && (e.message || (e.error && e.error.message))) || 'script error'); });
        window.addEventListener('unhandledrejection', function (e) { fail((e && e.reason && (e.reason.message || e.reason)) || 'startup error'); });
        setTimeout(function () { fail('startup is taking too long (12 s). Check that Android System WebView is up to date.'); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
